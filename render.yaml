# Render Blueprint for FoodDelivery (https://render.com/docs/blueprint-spec)
#
# One web service serves BOTH the API (/api/...) and the static frontend
# (Frontend/), so the browser talks to its own origin: no CORS setup and
# no API URL to configure. A managed PostgreSQL database is created
# alongside it and wired in through DATABASE_URL.
#
# The region cannot be changed after creation. Pick the one closest to
# your customers BEFORE the first deploy (oregon, ohio, virginia,
# frankfurt, singapore). The web service and database must share it.

databases:
  - name: food-delivery-db
    databaseName: food_delivery
    user: food_delivery
    region: frankfurt
    postgresMajorVersion: "18"
    plan: 0.1c-256mb   # paid; fine for launch. Larger plans: https://render.com/docs/compute-plans
    ipAllowList: []    # private network only: the database is not reachable from the internet

services:
  - type: web
    name: food-delivery
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb   # "free" works for a demo but sleeps after inactivity; not for live orders
    buildCommand: cd Backend && npm ci --omit=dev
    # exec lets Node receive SIGTERM directly for graceful shutdowns on deploy
    startCommand: cd Backend && exec node server.js
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: food-delivery-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # random 256-bit value, created once
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: TRUST_PROXY
        value: "1"
      - key: DASHBOARD_TIME_ZONE
        value: Africa/Nairobi
      # First admin account, created only if it does not exist yet.
      # Render asks for these when you first create the Blueprint.
      # Delete ADMIN_PASSWORD from the dashboard after the first successful start.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
