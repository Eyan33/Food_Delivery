<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deleted Accounts | Admin</title>
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="../../assets/css/admin.css">
<style>
:root{--deleted-green:#013420;--deleted-orange:#ff5a1f;--deleted-border:#e2e6e9;--deleted-muted:#59636e}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fffaf7;color:#171717;line-height:1.55}
.admin-header{display:block;background:var(--deleted-green);color:#fff;padding:0 24px;box-shadow:0 3px 12px rgba(0,0,0,.12)}
.admin-header-inner{max-width:1200px;min-height:64px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.admin-header a{color:#fff;text-decoration:none;font-weight:600;white-space:nowrap}
.admin-header nav{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.admin-header nav a{padding:20px 0;border-bottom:3px solid transparent}
.admin-header nav a:hover,.admin-header nav a[aria-current=page]{border-bottom-color:var(--deleted-orange)}
.deleted-wrap{width:min(1200px,100%);margin:38px auto;padding:0 24px}
.deleted-wrap h1{font-size:clamp(1.65rem,3vw,2rem);line-height:1.2;margin:0 0 10px;font-weight:700}
.deleted-wrap>p{color:#4b5563;margin:0 0 18px}
.deleted-card{background:#fff;border:1px solid var(--deleted-border);border-radius:12px;padding:22px;box-shadow:0 4px 18px rgba(23,43,77,.04)}
.deleted-filters{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 18px}
.deleted-filters input,.deleted-filters select{min-height:48px;padding:10px 13px;border:1px solid #cbd2d9;border-radius:7px;min-width:180px;max-width:100%;background:#fff;color:#171717}
.deleted-filters input{flex:1 1 230px}
.deleted-filters select{flex:0 1 180px}
.deleted-filters button,.deleted-btn{min-height:48px;padding:10px 16px;border:1px solid var(--deleted-green);border-radius:7px;background:var(--deleted-green);color:#fff;cursor:pointer;font-weight:600;white-space:nowrap}
.deleted-filters button:hover,.deleted-btn:hover{background:#024b30}
.deleted-filters button:focus-visible,.deleted-filters input:focus-visible,.deleted-filters select:focus-visible,.deleted-pagination button:focus-visible{outline:3px solid rgba(255,90,31,.35);outline-offset:2px}
.deleted-filters button:disabled{opacity:.55;cursor:wait}
.deleted-status{margin:12px 0 14px;color:var(--deleted-muted);min-height:24px}
.deleted-status.error{color:#a11b1b}
.deleted-table-wrap{width:100%;overflow-x:auto;border:1px solid #e7eaee;border-radius:8px}
.deleted-table-wrap table{width:100%;border-collapse:collapse;min-width:760px}
.deleted-table-wrap th,.deleted-table-wrap td{text-align:left;padding:13px 14px;border-bottom:1px solid #e7eaee;vertical-align:top;overflow-wrap:anywhere}
.deleted-table-wrap th{background:#f3f6f4;color:#202923;font-weight:700;white-space:nowrap}
.deleted-table-wrap tbody tr:last-child td{border-bottom:0}
.deleted-table-wrap tbody tr:hover{background:#fffaf7}
.deleted-empty{text-align:center;padding:24px;color:var(--deleted-muted)}
.deleted-pagination{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.deleted-pagination button{min-height:42px;padding:8px 13px;border:1px solid #ccd2d7;border-radius:7px;background:#fff;color:#171717;cursor:pointer}
.deleted-pagination button:hover:not(:disabled){border-color:var(--deleted-green);color:var(--deleted-green)}
.deleted-pagination button:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:700px){.admin-header{padding:12px 16px}.admin-header-inner{align-items:flex-start;gap:10px}.admin-header nav{gap:8px 16px}.admin-header nav a{padding:7px 0;border-bottom-width:2px}.deleted-wrap{margin:24px auto;padding:0 14px}.deleted-card{padding:15px}.deleted-filters{display:grid;grid-template-columns:1fr}.deleted-filters input,.deleted-filters select,.deleted-filters button{width:100%;min-width:0}.deleted-pagination{justify-content:center}}
</style>
</head>
<body>
<header class="admin-header"><div class="admin-header-inner"><a href="dashboard.html">Admin Dashboard</a><nav><a href="customers.html">Customers</a><a href="restaurants.html">Restaurants</a><a href="riders.html">Riders</a><a href="deleted-accounts.html" aria-current="page">Deleted Accounts</a></nav></div></header>
<main class="deleted-wrap">
<h1>Deleted Accounts</h1>
<p>This read-only register records account deletion details for audit purposes. Personal-data snapshots are not displayed or exported.</p>
<section class="deleted-card" aria-label="Deleted accounts register">
<div class="deleted-filters">
<input id="search" type="search" placeholder="Search account, ID, or reason" aria-label="Search deleted accounts">
<select id="type" aria-label="Account type"><option value="">All account types</option><option value="customer">Customer</option><option value="restaurant">Restaurant</option><option value="rider">Rider</option></select>
<button id="apply" type="button">Search</button>
<button id="export" type="button">Export All Matching CSV</button>
</div>
<div id="status" class="deleted-status" role="status" aria-live="polite">Loading deleted accounts…</div>
<div class="deleted-table-wrap"><table><thead><tr><th>Deleted at</th><th>Type</th><th>Original ID</th><th>Account</th><th>Deleted by</th><th>Reason</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="deleted-pagination"><button id="prev" type="button">Previous</button><span id="pageLabel">Page 1</span><button id="next" type="button">Next</button></div>
</section>
</main>
<script src="../../assets/js/api-config.js"></script>
<script src="../../assets/js/main.js"></script>
<script src="../../assets/js/auth/auth-api.js"></script>
<script>
(() => {
 const $=id=>document.getElementById(id); let page=1,pages=1,loading=false;
 const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 function token(){return localStorage.getItem("token")||localStorage.getItem("authToken")||sessionStorage.getItem("token")||"";}
 async function readPayload(response){const body=await response.text();try{return body?JSON.parse(body):{};}catch(_){throw new Error("The server returned an invalid response (HTTP "+response.status+").");}}
 function queryParams(targetPage,limit){return new URLSearchParams({page:String(targetPage),limit:String(limit),search:$("search").value.trim(),type:$("type").value});}
 async function requestPage(targetPage,limit){
  const response=await fetch((window.FOOD_DELIVERY_API_BASE||"")+"/admins/deleted-accounts?"+queryParams(targetPage,limit),{headers:{Authorization:"Bearer "+token(),"Accept":"application/json"}});
  const payload=await readPayload(response);
  if(response.status===401||response.status===403)throw new Error("Your admin session may have expired or you do not have permission. Sign in again and retry.");
  if(!response.ok||!payload.success)throw new Error(payload.message||"Could not load deleted-account records.");
  return payload.data;
 }
 async function load(){
  if(loading)return;loading=true;
  $("apply").disabled=$("export").disabled=true;$("status").classList.remove("error");$("status").textContent="Loading deleted accounts…";
  try{
   let data=await requestPage(page,25),pagination=data.pagination||{};
   pages=Math.max(1,Number(pagination.pages)||1);
   if(page>pages){page=pages;data=await requestPage(page,25);pagination=data.pagination||{};pages=Math.max(1,Number(pagination.pages)||1);}
   const rows=Array.isArray(data.accounts)?data.accounts:[];
   $("rows").innerHTML=rows.length?rows.map(row=>'<tr><td>'+esc(row.deleted_at?new Date(row.deleted_at).toLocaleString():"")+'</td><td>'+esc(row.account_type)+'</td><td>'+esc(row.original_account_id)+'</td><td>'+esc(row.account_label)+'</td><td>'+esc(row.deleted_by_label||"—")+'</td><td>'+esc(row.deletion_reason||"—")+'</td></tr>').join(""):'<tr><td class="deleted-empty" colspan="6">No deleted accounts match these filters.</td></tr>';
   $("status").textContent=Number(pagination.total||0)+" deleted account(s) found.";
   $("pageLabel").textContent="Page "+page+" of "+pages;$("prev").disabled=page<=1;$("next").disabled=page>=pages;
  }catch(error){$("rows").innerHTML="";$("status").classList.add("error");$("status").textContent=(error.message||"Unable to load records.")+" Use Search to retry.";$("pageLabel").textContent="Page "+page;$("prev").disabled=page<=1;$("next").disabled=true;}
  finally{loading=false;$("apply").disabled=false;$("export").disabled=false;}
 }
 function csvCell(value){
  let text=String(value??"");
  if(/^[\u0000-\u0020]*[=+@-]/.test(text))text="'"+text;
  return '"'+text.replace(/"/g,'""')+'"';
 }
 async function exportAllMatching(){
  if(loading)return;loading=true;const button=$("export");button.disabled=$("apply").disabled=true;button.textContent="Exporting…";
  try{
   const all=[];let exportPage=1,exportPages=1;
   do{
    const data=await requestPage(exportPage,100),pagination=data.pagination||{};
    all.push(...(Array.isArray(data.accounts)?data.accounts:[]));exportPages=Math.max(1,Number(pagination.pages)||1);exportPage++;
   }while(exportPage<=exportPages);
   if(!all.length){$("status").textContent="No deleted accounts match the current filters; nothing was exported.";return;}
   const columns=[["deleted_at","Deleted at"],["account_type","Account type"],["original_account_id","Original account ID"],["account_label","Account"],["deleted_by_label","Deleted by"],["deletion_reason","Deletion reason"]];
   const csv=[columns.map(c=>csvCell(c[1])).join(","),...all.map(row=>columns.map(c=>csvCell(c[0]==="deleted_at"&&row[c[0]]?new Date(row[c[0]]).toISOString():row[c[0]] )).join(","))].join("\r\n");
   const blob=new Blob(["\ufeff",csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");
   a.href=url;a.download="deleted-accounts-"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
   $("status").textContent="Exported "+all.length+" matching audit record(s). Snapshot data was not included.";
  }catch(error){$("status").classList.add("error");$("status").textContent=(error.message||"Could not export records.")+" Retry the export.";}
  finally{loading=false;button.disabled=$("apply").disabled=false;button.textContent="Export All Matching CSV";}
 }
 $("apply").addEventListener("click",()=>{page=1;load();});
 $("search").addEventListener("keydown",e=>{if(e.key==="Enter"){page=1;load();}});
 $("type").addEventListener("change",()=>{page=1;load();});
 $("prev").addEventListener("click",()=>{if(page>1){page--;load();}});
 $("next").addEventListener("click",()=>{if(page<pages){page++;load();}});
 $("export").addEventListener("click",exportAllMatching);
 load();
})();
</script>
</body></html>
