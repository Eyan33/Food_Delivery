<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Login to your Food Delivery account" />

    <title>Login | Food Delivery</title>

    <link rel="stylesheet" href="../../assets/css/style.css" />
    <style>
        .password-input-wrap { position: relative; }
        .password-input-wrap input { padding-right: 48px; }
        .password-visibility-toggle {
            position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
            display: inline-flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; padding: 0;
            border: 0; border-radius: 6px; background: transparent;
            color: #666; cursor: pointer;
        }
        .password-visibility-toggle:hover { color: var(--primary, #ff5a1f); background: #fff0e9; }
        .password-visibility-toggle:focus-visible { outline: 2px solid var(--primary, #ff5a1f); outline-offset: 2px; }
        .password-visibility-toggle svg { width: 20px; height: 20px; }
    </style>
</head>

<body>
    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="header">
        <a href="../../index.html" class="logo"> Food<span>Delivery</span> </a>

        <nav class="navigation">
            <span> Don't have an account? </span>

            <a href="register.html" class="nav-button"> Sign Up </a>
        </nav>
    </header>

    <!-- =========================================
         LOGIN
    ========================================== -->

    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-header">
                <h1>Welcome back</h1>

                <p>Login to continue ordering your favorite food.</p>
            </div>

            <!-- Login Form -->

            <form id="loginForm" class="auth-form">
                <!-- Email -->

                <div class="form-group">
                    <label for="email"> Email address </label>

                    <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email"
                        required />
                </div>

                <!-- Password -->

                <div class="form-group">
                    <div class="password-label">
                        <label for="password"> Password </label>

                        <a href="forgot-password.html"> Forgot password? </a>
                    </div>

                    <div class="password-input-wrap">
                        <input type="password" id="password" name="password" placeholder="Enter your password"
                            autocomplete="current-password" required />
                        <button class="password-visibility-toggle" type="button" id="passwordVisibilityToggle"
                            aria-label="Show password" aria-pressed="false" title="Show password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Remember Me -->

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" name="rememberMe" />

                        <span> Remember me </span>
                    </label>
                </div>

                <!-- Error / Success Message -->

                <div id="loginMessage" class="form-message" role="alert" aria-live="polite"></div>

                <!-- Submit -->

                <button type="submit" class="auth-button" id="loginButton">
                    Login
                </button>
            </form>

            <div class="auth-divider" aria-hidden="true"><span>OR</span></div>
            <div id="googleSignInButton" class="google-signin-container"></div>

            <!-- Register Link -->

            <div class="auth-footer">
                <p>
                    Don't have an account?
                    <a href="register.html"> Create one </a>
                </p>
            </div>
        </section>
    </main>

    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="footer">
        <p>&copy; 2026 Food Delivery. All rights reserved.</p>
    </footer>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="../../assets/js/api-config.js"></script>
    <script src="../../assets/js/auth/auth-api.js"></script>
    <script src="../../assets/js/auth/auth.js"></script>
    <script>
        const passwordInput = document.getElementById("password");
        const passwordToggle = document.getElementById("passwordVisibilityToggle");

        passwordToggle.addEventListener("click", () => {
            const willShow = passwordInput.type === "password";
            passwordInput.type = willShow ? "text" : "password";
            passwordToggle.setAttribute("aria-pressed", String(willShow));
            passwordToggle.setAttribute("aria-label", `${willShow ? "Hide" : "Show"} password`);
            passwordToggle.setAttribute("title", `${willShow ? "Hide" : "Show"} password`);
        });
    </script>
</body>

</html>
